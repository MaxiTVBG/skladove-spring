spring:
  application:
    name: skladove-spring
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

app:
  admin:
    password: ${ADMIN_PASSWORD:admin123}

springdoc:
  swagger-ui:
    path: /swagger-ui.html