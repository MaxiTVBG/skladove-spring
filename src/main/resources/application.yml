spring:
  application:
    name: skladove-spring
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

app:
  admin:
    password: ${ADMIN_PASSWORD:admin123}

# API документация (задача №16): Swagger UI на /swagger-ui.html, OpenAPI JSON на /v3/api-docs.
# В документацията влизат само REST адресите, не HTML страниците.
springdoc:
  paths-to-match: /api/**, /owner/api/**, /agent/api/**
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    display-request-duration: true