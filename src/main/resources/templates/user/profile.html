
<!DOCTYPE html>
<html lang="bg" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Моят профил</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 40px;
        }

        .container {
            max-width: 650px;
            margin: auto;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        input {
            display: block;
            width: 95%;
            padding: 10px;
            margin: 10px 0 18px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            background: #245b85;
            color: white;
            padding: 10px 18px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>
<div class="container">

    <h1>Моят профил</h1>

    <div class="card">

        <p class="success"
           th:if="${successMessage}"
           th:text="${successMessage}"></p>

        <p class="error"
           th:if="${errorMessage}"
           th:text="${errorMessage}"></p>

        <p><strong>Потребителско име:</strong>
            <span th:text="${user.username}"></span>
        </p>

        <p><strong>Роля:</strong>
            <span th:text="${user.role}"></span>
        </p>

        <form th:action="@{/profile}" method="post">

            <label>Пълно име</label>
            <input type="text" name="fullName"
                   th:value="${user.fullName}" required>

            <label>Имейл</label>
            <input type="email" name="email"
                   th:value="${user.email}">

            <label>Телефон</label>
            <input type="text" name="phone"
                   th:value="${user.phone}">

            <button type="submit">Запази промените</button>

        </form>

        <div th:if="${user.role.name() == 'AGENT'}">
            <hr>
            <h2>Информация за складов агент</h2>

            <p><strong>Хонорар:</strong>
                <span th:text="${user.fee != null
                    ? user.fee + '%' : 'Все още не е определен'}"></span>
            </p>

            <p><strong>Рейтинг:</strong>
                <span th:text="${user.rating != null
                    ? user.rating : 'Все още няма рейтинг'}"></span>
            </p>
        </div>

    </div>

    <p><a th:href="@{/}">Обратно към началната страница</a></p>

</div>
</body>
</html>
