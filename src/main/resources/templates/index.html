<!DOCTYPE html>
<html lang="bg" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Складове</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background: #f4f6f9;
            color: #243b53;
        }

        h1 { color: #245b85; }

        .card {
            background: white;
            padding: 25px;
            border-radius: 8px;
            max-width: 700px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li { margin: 12px 0; }

        a {
            display: inline-block;
            padding: 10px 15px;
            background: #e4e7eb;
            color: #243b53;
            text-decoration: none;
            border-radius: 5px;
        }

        a:hover { background: #d0d7de; }

        .logout {
            margin-top: 20px;
            padding: 10px 18px;
            background: #245b85;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>Система за складове</h1>

    <p>Здравей, <b sec:authentication="name"></b>!</p>

    <ul>
        <!-- Common navigation -->
        <li>
            <a th:href="@{/profile}">👤 Моят профил</a>
        </li>

        <!-- Notifications for owners and agents -->
        <li sec:authorize="hasAnyRole('OWNER', 'AGENT')">
            <a th:href="@{/notifications}">🔔 Известия</a>
        </li>

        <!-- Admin -->
        <li sec:authorize="hasRole('ADMIN')">
            <a th:href="@{/admin}">Администрация</a>
        </li>

        <!-- Owner -->
        <li sec:authorize="hasRole('OWNER')">
            <a th:href="@{/owner}">Моите складове</a>
        </li>

        <li sec:authorize="hasRole('OWNER')">
            <a th:href="@{/owner/rentals}">Заявки за наем</a>
        </li>

        <li sec:authorize="hasRole('OWNER')">
            <a th:href="@{/owner/reports/warehouses}">
                Справка: моите складове
            </a>
        </li>

        <!-- Agent -->
        <li sec:authorize="hasRole('AGENT')">
            <a th:href="@{/agent}">Наеми</a>
        </li>

        <li sec:authorize="hasRole('AGENT')">
            <a th:href="@{/agent/report}">Моята справка</a>
        </li>

        <li sec:authorize="hasRole('AGENT')">
            <a th:href="@{/agent/ai/recommend}">
                Препоръка на склад (AI)
            </a>
        </li>

        <!-- Shared reports -->
        <li sec:authorize="hasAnyRole('OWNER', 'AGENT')">
            <a th:href="@{/reports/available}">
                Справка: налични складове
            </a>
        </li>
    </ul>

    <form th:action="@{/logout}" method="post">
        <button class="logout" type="submit">Изход</button>
    </form>
</div>

</body>
</html>
