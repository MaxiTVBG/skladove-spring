<!DOCTYPE html>
<html lang="bg" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Формуляр за наем - Складове</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f4f6f9; }
        h1, h2 { color: #243b53; }
        h2 { font-size: 18px; margin: 20px 0 6px; }
        .container { max-width: 760px; margin: auto; }
        .card { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .summary { background: #f0f4f8; border-radius: 6px; padding: 14px 16px; margin-bottom: 10px; line-height: 1.6; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 20px; }
        .full { grid-column: 1 / -1; }
        label { font-weight: bold; color: #334e68; font-size: 14px; }
        input { display: block; width: 100%; box-sizing: border-box; padding: 10px;
                margin: 6px 0 4px; border: 1px solid #ccc; border-radius: 4px; }
        .invalid { border-color: #a32121; background: #fffafa; }
        .field-error { color: #a32121; font-size: 13px; margin-bottom: 12px; display: block; }
        .hint { color: #829ab1; font-size: 13px; margin-bottom: 12px; display: block; }
        .error { color: #a32121; background: #fde8e8; padding: 12px; border-radius: 4px; }
        .actions { margin-top: 20px; display: flex; gap: 10px; }
        .btn { padding: 10px 18px; border: none; border-radius: 4px; background: #245b85;
               color: white; text-decoration: none; cursor: pointer; font-size: 15px; }
        .btn:hover { background: #17466d; }
        .btn-light { background: #e4e7eb; color: #243b53; }
        @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<div class="container">

    <h1>Формуляр за наем</h1>

    <!-- Грешка от бизнес правило, напр. застъпване с друг активен договор -->
    <p class="error" th:if="${errorMessage}" th:text="${errorMessage}"></p>

    <div class="card">
        <div class="summary">
            <b th:text="${warehouse.name}">Склад</b> · <span th:text="${warehouse.address}"></span><br>
            Собственик: <span th:text="${warehouse.owner.fullName}"></span> ·
            площ <span th:text="${warehouse.area}"></span> м² ·
            категория <span th:text="${warehouse.category}"></span> ·
            <span th:text="${#numbers.formatDecimal(warehouse.monthlyPrice, 1, 2)} + ' лв. / месец'"></span>
        </div>

        <form th:action="@{/agent/rentals}" th:object="${rentalForm}" method="post" novalidate>
            <input type="hidden" th:field="*{warehouseId}">

            <h2>Наемател</h2>
            <div class="grid">
                <div class="full">
                    <label for="tenantName">Име / фирма *</label>
                    <input id="tenantName" type="text" th:field="*{tenantName}" th:errorclass="invalid">
                    <span class="field-error" th:errors="*{tenantName}"></span>
                </div>
                <div>
                    <label for="tenantPhone">Телефон</label>
                    <input id="tenantPhone" type="text" th:field="*{tenantPhone}" th:errorclass="invalid">
                    <span class="field-error" th:errors="*{tenantPhone}"></span>
                </div>
                <div>
                    <label for="tenantEmail">Имейл</label>
                    <input id="tenantEmail" type="email" th:field="*{tenantEmail}" th:errorclass="invalid">
                    <span class="field-error" th:errors="*{tenantEmail}"></span>
                </div>
            </div>

            <h2>Период и цена</h2>
            <div class="grid">
                <div>
                    <label for="startDate">От дата *</label>
                    <input id="startDate" type="date" th:field="*{startDate}" th:errorclass="invalid">
                    <span class="field-error" th:errors="*{startDate}"></span>
                </div>
                <div>
                    <label for="endDate">До дата *</label>
                    <input id="endDate" type="date" th:field="*{endDate}" th:errorclass="invalid">
                    <span class="field-error" th:errors="*{endDate}"></span>
                </div>
                <div class="full">
                    <!-- грешката от проверката „крайната дата е след началната“ -->
                    <span class="field-error" th:errors="*{periodValid}"></span>
                </div>
                <div>
                    <label for="price">Цена (лв.) *</label>
                    <input id="price" type="number" step="0.01" min="0" th:field="*{price}" th:errorclass="invalid">
                    <span class="field-error" th:errors="*{price}"></span>
                    <span class="hint">Попълнена е с месечната цена на склада; може да се промени.</span>
                </div>
            </div>

            <div class="actions">
                <button class="btn" type="submit">Изпрати за одобрение</button>
                <a class="btn btn-light" th:href="@{/agent/rentals}">Отказ</a>
            </div>
        </form>
    </div>

</div>
</body>
</html>
