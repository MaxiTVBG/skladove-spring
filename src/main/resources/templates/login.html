<!DOCTYPE html>
<html lang="bg" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Вход - Складове</title>
</head>
<body>
<h1>Вход в системата</h1>
<p th:if="${param.error}">Грешно потребителско име или парола.</p>
<p th:if="${param.logout}">Излязохте успешно.</p>
<form th:action="@{/login}" method="post">
    <label>Потребител: <input type="text" name="username" required></label><br>
    <label>Парола: <input type="password" name="password" required></label><br>
    <button type="submit">Вход</button>
</form>
</body>
</html>
