
<!DOCTYPE html>
<html lang="bg" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Известия</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f5f8;
            margin: 0;
            padding: 30px;
            color: #263746;
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        h1 {
            color: #245b80;
        }

        .card {
            background: white;
            padding: 22px;
            margin-top: 18px;
            border-radius: 9px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .notification {
            border-left: 5px solid #245b80;
        }

        .unread {
            background: #eef5fb;
        }

        .read {
            opacity: 0.75;
        }

        .message {
            font-size: 16px;
            margin-bottom: 10px;
        }

        .muted {
            color: #718096;
            font-size: 13px;
        }

        .type {
            font-weight: bold;
            color: #245b80;
        }

        .btn {
            display: inline-block;
            padding: 8px 14px;
            background: #245b80;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
        }

        .btn:hover {
            background: #194463;
        }

        .empty {
            text-align: center;
            color: #718096;
            padding: 35px;
        }

        .success {
            color: #187a37;
            background: #e5f5e9;
            padding: 12px;
            border-radius: 5px;
        }

        .error {
            color: #a32121;
            background: #fde8e8;
            padding: 12px;
            border-radius: 5px;
        }

        .back {
            display: inline-block;
            margin-top: 20px;
            color: #245b80;
            text-decoration: none;
        }
    </style>
</head>

<body>
<div class="container">

    <h1>Моите известия</h1>

    <p class="success"
       th:if="${successMessage}"
       th:text="${successMessage}"></p>

    <p class="error"
       th:if="${errorMessage}"
       th:text="${errorMessage}"></p>

    <div th:if="${#lists.isEmpty(notifications)}" class="card empty">
        Все още нямате известия.
    </div>

    <div th:each="notification : ${notifications}"
         class="card notification"
         th:classappend="${notification.read} ? 'read' : 'unread'">

        <p class="type"
           th:switch="${notification.type.name()}">

            <span th:case="'NEW_RENTAL_REQUEST'">
                Нова заявка за наем
            </span>

            <span th:case="'WAREHOUSE_RENTED'">
                Отдаден склад
            </span>

            <span th:case="'CONTRACT_EXPIRING'">
                Изтичащ договор
            </span>

            <span th:case="*">
                Известие
            </span>
        </p>

        <p class="message"
           th:text="${notification.message}">
        </p>

        <p class="muted"
           th:text="${#temporals.format(notification.createdAt, 'dd.MM.yyyy HH:mm')}">
        </p>

        <p class="muted"
           th:if="${notification.read}">
            Прочетено
        </p>

        <form th:if="${!notification.read}"
              th:action="@{/notifications/{id}/read(id=${notification.id})}"
              method="post">

            <button type="submit" class="btn">
                Маркирай като прочетено
            </button>
        </form>

    </div>

    <a class="back" th:href="@{/}">
        Обратно към началната страница
    </a>

</div>
</body>
</html>
