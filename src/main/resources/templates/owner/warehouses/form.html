<!DOCTYPE html>
<html lang="bg" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${warehouseId == null} ? 'Нов склад - Складове' : 'Редакция на склад - Складове'">Склад</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f4f6f9; }
        h1 { color: #243b53; }
        .container { max-width: 760px; margin: auto; }
        .card { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 20px; }
        .full { grid-column: 1 / -1; }
        label { font-weight: bold; color: #334e68; font-size: 14px; }
        input, select { display: block; width: 100%; box-sizing: border-box; padding: 10px;
                        margin: 6px 0 4px; border: 1px solid #ccc; border-radius: 4px; }
        .invalid { border-color: #a32121; background: #fffafa; }
        .field-error { color: #a32121; font-size: 13px; margin-bottom: 12px; display: block; }
        .hint { color: #829ab1; font-size: 13px; margin-bottom: 12px; display: block; }
        .actions { margin-top: 15px; display: flex; gap: 10px; }
        .btn { padding: 10px 18px; border: none; border-radius: 4px; background: #245b85;
               color: white; text-decoration: none; cursor: pointer; font-size: 15px; }
        .btn:hover { background: #17466d; }
        .btn-light { background: #e4e7eb; color: #243b53; }
        @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<div class="container">

    <h1 th:text="${warehouseId == null} ? 'Нов склад' : 'Редакция на склад'">Склад</h1>

    <div class="card">
        <!-- Един и същ шаблон: без id изпраща към /owner/warehouses (създаване),
             с id към /owner/warehouses/{id} (редакция). th:action добавя и CSRF токена. -->
        <form th:action="${warehouseId == null} ? @{/owner/warehouses} : @{/owner/warehouses/{id}(id=${warehouseId})}"
              th:object="${warehouseForm}" method="post" novalidate>

            <div class="grid">
                <div class="full">
                    <label for="name">Име на склада *</label>
                    <input id="name" type="text" th:field="*{name}" th:errorclass="invalid"
                           placeholder="напр. Склад Север">
                    <span class="field-error" th:errors="*{name}"></span>
                </div>

                <div class="full">
                    <label for="address">Адрес *</label>
                    <input id="address" type="text" th:field="*{address}" th:errorclass="invalid"
                           placeholder="град, улица, номер">
                    <span class="field-error" th:errors="*{address}"></span>
                </div>

                <div>
                    <label for="area">Площ (м²) *</label>
                    <input id="area" type="number" step="0.01" min="0" th:field="*{area}" th:errorclass="invalid">
                    <span class="field-error" th:errors="*{area}"></span>
                </div>

                <div>
                    <label for="height">Височина (м)</label>
                    <input id="height" type="number" step="0.01" min="0" th:field="*{height}" th:errorclass="invalid">
                    <span class="field-error" th:errors="*{height}"></span>
                </div>

                <div>
                    <label for="category">Категория *</label>
                    <select id="category" th:field="*{category}" th:errorclass="invalid">
                        <option value="">-- изберете --</option>
                        <option th:each="c : ${categories}" th:value="${c}" th:text="'Категория ' + ${c}"></option>
                    </select>
                    <span class="field-error" th:errors="*{category}"></span>
                </div>

                <div>
                    <label for="monthlyPrice">Цена на месец (лв.) *</label>
                    <input id="monthlyPrice" type="number" step="0.01" min="0" th:field="*{monthlyPrice}"
                           th:errorclass="invalid">
                    <span class="field-error" th:errors="*{monthlyPrice}"></span>
                </div>

                <div>
                    <label for="climateConditions">Климатични условия</label>
                    <input id="climateConditions" type="text" th:field="*{climateConditions}"
                           list="climates" placeholder="напр. сух, хладилен">
                    <datalist id="climates">
                        <option value="Сух">
                        <option value="Отопляем">
                        <option value="Хладилен (0–8 °C)">
                        <option value="Фризер (под -18 °C)">
                    </datalist>
                    <span class="hint">Изберете от списъка или напишете свое.</span>
                </div>

                <div>
                    <label for="goodsType">Вид на стоката</label>
                    <input id="goodsType" type="text" th:field="*{goodsType}"
                           placeholder="напр. храни, мебели, техника">
                </div>
            </div>

            <div class="actions">
                <button class="btn" type="submit"
                        th:text="${warehouseId == null} ? 'Добави склада' : 'Запази промените'">Запази</button>
                <a class="btn btn-light" th:href="@{/owner/warehouses}">Отказ</a>
            </div>
        </form>
    </div>

</div>
</body>
</html>
